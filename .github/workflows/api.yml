# Skor tablosu API'si (wordvoya.com/api/v1): master'a push'ta (api/ değiştiyse) ya da elle sunucuya dağıtılır.
# Sunucuda /root/wordvoya-api, konteyner 127.0.0.1:8087; veritabanı /root/wordvoya-api/data (SQLite + günlük yedek).
# Önünde host nginx: /etc/nginx/sites-available/wordvoya.com içinde "location /api/" (bir kez elle eklendi).
# Secret'lar site.yml ile aynı: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PASSWORD.
name: API'yi yayınla

on:
  push:
    branches: [master]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

env:
  DEPLOY_DIR: /root/wordvoya-api
  APP_PORT: "8087"

jobs:
  deploy:
    name: Test et ve sunucuya dağıt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Secret kontrolü
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "::error::DEPLOY_* secret'ları tanımlı değil (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testler
        working-directory: api
        run: npm test

      - name: API dosyalarını sunucuya kopyala
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7 (sunucu şifresini alır: commit özetine sabit)
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "api"
          target: ${{ env.DEPLOY_DIR }}/
          strip_components: 1

      - name: Konteyneri kur ve doğrula
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0 (sunucu şifresini alır: commit özetine sabit)
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"
            # Konteyner "node" kullanıcısıyla (uid 1000) yazar
            mkdir -p data/backup
            chown -R 1000:1000 data
            docker tag wordvoya-api:latest wordvoya-api:previous 2>/dev/null || true
            docker compose build
            docker compose up -d
            ok=""
            for i in $(seq 1 15); do
              sleep 2
              if curl -sf -o /dev/null "http://127.0.0.1:${{ env.APP_PORT }}/api/v1/health"; then ok=1; echo "API $((i*2)). saniyede cevap verdi."; break; fi
            done
            if [ -n "$ok" ]; then
              # Günlük yedek, 04:20'de (yinelenmesin diye önce eski satır silinir)
              ( crontab -l 2>/dev/null | grep -v 'wordvoya-api node src/backup.ts' ; echo '20 4 * * * docker exec wordvoya-api node src/backup.ts >> /root/wordvoya-api/backup.log 2>&1' ) | crontab -
              echo "Dağıtım başarılı."
              docker image prune -f >/dev/null
            else
              echo "API ayağa kalkmadı, önceki imaja dönülüyor!"
              docker logs --tail 50 wordvoya-api || true
              if docker image inspect wordvoya-api:previous >/dev/null 2>&1; then
                docker tag wordvoya-api:previous wordvoya-api:latest
                docker compose up -d --no-build
              fi
              exit 1
            fi
