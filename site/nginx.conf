server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Ters proxy arkasında çalışır: yönlendirmeler göreli kalsın (https korunur)
    absolute_redirect off;
    server_tokens off;

    # Güvenlik: CSP kaynak kısıtlamaz (AdSense betiği, çerçeve ve görselleri çok sayıda Google alan adından gelir)
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kısa adresler (uygulama ve mağaza için kalıcı)
    location = /privacy        { return 301 /en/privacy.html; }
    location = /privacy-policy { return 301 /en/privacy.html; }
    location = /terms          { return 301 /en/terms.html; }
    location = /terms-of-use   { return 301 /en/terms.html; }
    location = /gizlilik       { return 301 /gizlilik.html; }
    location = /kullanim-sartlari { return 301 /kullanim-sartlari.html; }
    location ~ "^/(en|de|fr|es|it|pt|ru|nl|pl|ja|ko|ar|fa|hi)$" { return 301 $uri/; }

    # Görseller ve stil uzun süre önbellekte kalabilir (değişince ?v= artırılır)
    location ~* \.(css|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML önbelleğe alınmasın: güncellemeler herkese anında ulaşsın
    location / {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
